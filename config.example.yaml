# https://docs.litellm.ai/docs/proxy/config_settings
environment_variables:
  DISABLE_ADMIN_UI: True

model_list:
  - model_name: minimax-m2.5
    litellm_params:
      model: minimax/MiniMax-M2.5
      api_key: os.environ/MINIMAX_API_KEY
  - model_name: minimax-m2
    litellm_params:
      model: minimax/MiniMax-M2
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: glm-4.5
    litellm_params:
      model: zai/glm-4.5
      api_base: os.environ/ZAI_API_BASE
      api_key: os.environ/ZAI_API_KEY
  - model_name: glm-4.5-air
    litellm_params:
      model: zai/glm-4.5-air
      api_base: os.environ/ZAI_API_BASE
      api_key: os.environ/ZAI_API_KEY

  - model_name: claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5

  - model_name: gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini

  - model_name: grok-code-fast-1
    litellm_params:
      model: github_copilot/grok-code-fast-1

litellm_settings:
  drop_params: true
  callbacks:
    - rate_limit_plugin.callback

router_settings:
  fallbacks:
    - claude-haiku-4.5:
        - glm-4.5-air
        - minimax-m2

  model_group_alias:
    claude-haiku-4-5: claude-haiku-4.5

general_settings:
  master_key: os.environ/MASTER_KEY

rate_limit_plugin:
  # Default cooldown when no reset time in headers
  default_cooldown_seconds: 3600
  logging:
    log_level: DEBUG
    router_log_level: CRITICAL
    # Log request headers in pre-call hook (default: false)
    # log_request_header: true
    # Log request body in pre-call hook for POST/PUT calls (default: false)
    # log_request_body: true
    # File logging (default: disabled)
    # log_file_enabled: true
    # log_file: ./logs/litellm.log
    # error_log_file: ./logs/litellm-error.log
    # log_file_rotating:
    #   handler: none  # none (default), RotatingFileHandler, TimedRotatingFileHandler
    #   # Size-based rotation (handler: RotatingFileHandler)
    #   # max_bytes: 5242880  # 5MB
    #   # backup_count: 3
    #   # Time-based rotation (handler: TimedRotatingFileHandler)
    #   # when: midnight
    #   # interval: 1

  # Header parsing configuration
  header_parsing:
    enabled: true
    # Anthropic's unified reset header (Unix timestamp)
    anthropic_reset_header: "anthropic-ratelimit-unified-reset"

  # Health check configuration
  health_check:
    enabled: true
    # How often to run health checks (seconds)
    interval_seconds: 3600
    # Prompt to send for health checks
    test_prompt: "Say 'ok'"
    # Maximum acceptable latency (ms)
    max_latency_ms: 30000
    # Timeout for individual health checks (seconds)
    timeout_seconds: 30
    models_to_check:
      - minimax-m2:
        - minimax-m2
        - minimax-m2.5
      - glm-4.5-air:
        - glm-4.5-air
        - glm-4.5
      - grok-code-fast-1:
        - grok-code-fast-1
        - gpt-5-mini
      - claude-haiku-4.5:
        - claude-haiku-4.5
